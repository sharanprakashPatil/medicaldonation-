{% extends 'base.html' %}
{% block title %}Donor Dashboard - Medical Hope{% endblock %}
{% block content %}

    <p style="color: var(--text-muted); margin: 1rem 0 2rem; font-size: 1.1rem;">Thank you for being part of our life-saving community.</p>
    <div style="display: flex; gap: 1rem; justify-content: center;">

    </div>
</div>
{% endblock %}
