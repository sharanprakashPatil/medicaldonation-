{% extends 'base.html' %}
{% block title %}Create Ticket - Medical Hope{% endblock %}
{% block content %}
<div class="glass-card" style="max-width: 700px; margin: 2rem auto;">
    <h2 style="margin-bottom: 0.5rem;">Create Support Ticket</h2>
    <p style="color: var(--text-muted); margin-bottom: 2rem;">Select a category and describe your issue. Our team will get back to you.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Issue Category</label>
            <select name="category" class="form-control" required>
                <option value="" disabled selected>-- Select a Category --</option>
                <option value="VERIFICATION">Verification & Documents</option>
                <option value="PAYMENT">Payment / Donation Issue</option>
                <option value="ACCOUNT">Account & Login Issue</option>
                <option value="CAMPAIGN">Campaign Management</option>
                <option value="TECHNICAL">Technical Support</option>
                <option value="OTHER">Other</option>
            </select>
        </div>
        <div class="form-group">
            <label>Message</label>
            <textarea name="message" class="form-control" rows="6" placeholder="Describe your issue in detail..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Submit Ticket</button>
        <a href="{% url 'my_tickets' %}" class="btn btn-outline">View My Tickets</a>
    </form>
</div>
{% endblock %}
