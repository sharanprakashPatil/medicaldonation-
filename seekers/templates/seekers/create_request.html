{% extends 'base.html' %}
{% block title %}Create Donation Request - Medical Hope{% endblock %}
{% block content %}
<div class="glass-card" style="max-width: 800px; margin: 2rem auto;">
    <h2 style="margin-bottom: 2rem;">Create a Donation Campaign</h2>
    <form method="post">
        {% csrf_token %}
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 1.5rem;">
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Campaign Title</label>
                {{ form.title.errors }}
                <input type="text" name="title" class="form-control" required placeholder="e.g., Support for Heart Surgery">
            </div>
            <div class="form-group">
                <label>Patient Name</label>
                <input type="text" name="patient_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Goal Amount (₹)</label>
                <input type="number" name="goal_amount" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Hospital Name</label>
                <input type="text" name="hospital_name" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Diagnosis</label>
                <input type="text" name="diagnosis" class="form-control" required>
            </div>
            <div class="form-group" style="grid-column: 1 / -1;">
                <label>Detailed Description</label>
                <textarea name="description" class="form-control" rows="5" required></textarea>
            </div>
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Create & Continue</button>
    </form>
</div>
{% endblock %}
