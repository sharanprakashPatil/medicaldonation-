{% extends 'base.html' %}
{% block title %}Reset Password - Medical Hope{% endblock %}
{% block content %}
<div class="glass-card" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-bottom: 2rem;">New Password</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" name="password" id="password" class="form-control" required>
        </div>
        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Reset Password</button>
    </form>
</div>
{% endblock %}
