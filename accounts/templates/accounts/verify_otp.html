{% extends 'base.html' %}
{% block title %}Verify OTP - Medical Hope{% endblock %}
{% block content %}
<div class="glass-card" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Verify OTP</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center;">Enter the code we sent to your email.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="otp">Enter 6-digit OTP</label>
            <input type="text" name="otp" id="otp" class="form-control" required maxlength="6" pattern="\d{6}" placeholder="000000" style="text-align: center; font-size: 1.5rem; letter-spacing: 0.5rem;">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Verify OTP</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem;">
        <p style="font-size: 0.8rem; color: var(--text-muted);">Haven't received it? Check your spam or <a href="{% url 'forgot_password' %}">try again</a></p>
    </div>
</div>
{% endblock %}
