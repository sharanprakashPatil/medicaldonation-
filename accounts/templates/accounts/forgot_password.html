{% extends 'base.html' %}
{% block title %}Forgot Password - Medical Hope{% endblock %}
{% block content %}
<div class="glass-card" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Forgot Password</h2>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; text-align: center;">Enter your registered email to receive a 6-digit OTP.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" required placeholder="name@example.com">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Send OTP</button>
    </form>
    <div style="text-align: center; margin-top: 1.5rem;">
        <a href="{% url 'login' %}" style="font-size: 0.9rem;">Back to Login</a>
    </div>
</div>
{% endblock %}
