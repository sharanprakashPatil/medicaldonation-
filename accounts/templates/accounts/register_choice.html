{% extends 'base.html' %}
{% block title %}Register - Medical Hope{% endblock %}
{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <h2 style="margin-bottom: 2rem;">Join Medical Hope</h2>
    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
        <div style="padding: 1.5rem; border: 1px solid var(--surface-border); border-radius: 0.5rem; background: var(--glass);">
            <h3>Need Help?</h3>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Create a campaign to raise funds for medical treatment.</p>
            <a href="{% url 'seeker_register' %}" class="btn btn-primary" style="width: 100%;">Register as Seeker</a>
        </div>
        <div style="padding: 1.5rem; border: 1px solid var(--surface-border); border-radius: 0.5rem; background: var(--glass);">
            <h3>Want to Help?</h3>
            <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Donate to people in need and save lives.</p>
            <a href="{% url 'donor_register' %}" class="btn btn-outline" style="width: 100%;">Register as Donor</a>
        </div>
    </div>
</div>
{% endblock %}
