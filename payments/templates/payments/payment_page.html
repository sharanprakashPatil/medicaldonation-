{% extends 'base.html' %}
{% block title %}Complete Payment - Medical Hope{% endblock %}
{% block content %}
<div class="glass-card" style="max-width: 500px; margin: 4rem auto; text-align: center;">
    <h2>Secure Checkout</h2>
    <p style="margin-top: 1rem; color: var(--text-muted);">You are donating ₹{{ amount }} to</p>
    <h3 style="margin: 0.5rem 0 2rem;">{{ donation_request.title }}</h3>

    <div style="padding: 2rem; border-radius: 1rem; background: var(--glass); margin-bottom: 2rem;">
        <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 2rem;">Click below to open the Razorpay payment gateway.</p>
        <button id="rzp-button1" class="btn btn-primary" style="width: 100%;">Pay ₹{{ amount }} Now</button>
    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
    var options = {
        "key": "{{ razorpay_key }}", // Enter the Key ID generated from the Dashboard
        "amount": "{{ razorpay_amount }}", // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
        "currency": "INR",
        "name": "Medical Hope",
        "description": "Donation for {{ donation_request.title }}",
        "order_id": "{{ order_id }}", //This is a sample Order ID. Pass the `id` obtained in the response of Step 1
        "handler": function (response){
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = "{% url 'payment_callback' %}";
            
            const fields = {
                'razorpay_payment_id': response.razorpay_payment_id,
                'razorpay_order_id': response.razorpay_order_id,
                'razorpay_signature': response.razorpay_signature,
                'csrfmiddlewaretoken': '{{ csrf_token }}'
            };

            for (const key in fields) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = fields[key];
                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        },
        "prefill": {
            "name": "{{ user.username }}",
            "email": "{{ user.email }}",
            "contact": "{{ user.phone_number|default:'' }}"
        },
        "theme": {
            "color": "#6366f1"
        }
    };
    var rzp1 = new Razorpay(options);
    document.getElementById('rzp-button1').onclick = function(e){
        rzp1.open();
        e.preventDefault();
    }
    </script>
</div>
{% endblock %}
